<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>P & M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/effects.css" />
</head>
<body>
  <div id="hearts-bg" aria-hidden="true"></div>

  <main id="app">
    <section id="select-screen" class="screen active">
      <div class="pixel-panel select-panel">
        <h1>ELIGE JUGADOR</h1>
        <div class="character-grid">
          <button class="character-card" data-select-player="paula">
            <img class="avatar-img" data-img="paula" alt="Paula" />
            <span>PAULA</span>
          </button>
          <button class="character-card" data-select-player="miguel">
            <img class="avatar-img" data-img="miguel" alt="Miguel" />
            <span>MIGUEL</span>
          </button>
        </div>
        <p class="tiny-text">&lt;3</p>
      </div>
    </section>

    <section id="intro-screen" class="screen">
      <div class="intro-content">
        <p id="intro-text"></p>
      </div>
      <p class="skip-hint">DOBLE TAP PARA SKIP</p>
    </section>

    <section id="main-screen" class="screen">
      <header class="topbar">
        <div class="menu-wrap">
          <button id="menu-button" class="icon-button" aria-label="Abrir menú">☰</button>
          <nav id="dropdown" class="dropdown hidden">
            <button data-section="buttons">Botones cariñosos</button>
            <button data-section="scoreboard">Marcador</button>
            <button id="playlist-link">Playlist</button>
            <div class="menu-audio-controls">
    <button id="music-mute-button" class="menu-icon-button" type="button" aria-label="Mutear música">
      <img src="assets/img/mute.png" alt="Mutear música" />
      <span>Música</span>
    </button>

    <button id="sfx-mute-button" class="menu-icon-button" type="button" aria-label="Silenciar efectos">
      <img src="assets/img/shh.png" alt="Silenciar efectos" />
      <span>Efectos</span>
    </button>
            </div>
          </nav>
        </div>

        <button id="avatar-toggle" class="avatar-toggle" aria-label="Cambiar jugador">
          <img id="current-avatar" alt="Avatar actual" />
        </button>
      </header>

      <section class="hero pixel-panel">
        <p class="label">JUGADOR ACTUAL:</p>
        <h2 id="player-name">PAULA</h2>
        <p id="interaction-text" class="small-text">Pulsa cualquier botón para interactuar con Miguel.</p>
      </section>

      <section id="buttons-section" class="love-buttons">
        <button class="love-card" data-action="besos">
          <div class="combo-badge hidden" data-combo-for="besos">x0</div>
          <img class="action-img" data-action-img="besos" alt="Besar" />
          <span>Besar (ﾉ´ з `)ノ</span>
        </button>
        <button class="love-card" data-action="mordidas">
          <div class="combo-badge hidden" data-combo-for="mordidas">x0</div>
          <img class="action-img" data-action-img="mordidas" alt="Morder" />
          <span>MORDER ÑAM</span>
        </button>
        <button class="love-card" data-action="abrazos">
          <div class="combo-badge hidden" data-combo-for="abrazos">x0</div>
          <img class="action-img" data-action-img="abrazos" alt="Abrazar" />
          <span>Abrazar UwU</span>
        </button>
        <button class="love-card" data-action="manitas">
          <div class="combo-badge hidden" data-combo-for="manitas">x0</div>
          <img class="action-img" data-action-img="manitas" alt="Hacer manitas" />
          <span>Hacer manitas (≧◡≦)</span>
        </button>
      </section>

      <section id="scoreboard-section" class="scoreboard pixel-panel">
        <p class="label">HAS RECIBIDO:</p>
        <div class="score-grid">
          <div><span>BESOS</span><strong id="score-besos">0</strong></div>
          <div><span>MORDIDAS＼(≧▽≦)／</span><strong id="score-mordidas">0</strong></div>
          <div><span>ABRAZOS</span><strong id="score-abrazos">0</strong></div>
          <div><span>MANITAS</span><strong id="score-manitas">0</strong></div>
        </div>
      </section>
    </section>
  </main>

  <div id="floating-layer" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/images.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/combo.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
